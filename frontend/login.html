<body>
    <div class="auth-wrapper">
        <!-- Logo -->
        <div class="logo-block">
            <div class="logo-text">FERRO<span>MIND</span></div>
            <div class="logo-sub">SAIL Durgapur · Steel Melting Shop</div>
        </div>

        <!-- Card -->
        <div class="auth-card">
            <!-- Title -->
            <div class="card-title">
                <span class="icon">🔒</span>
                <span id="cardTitleText">Sign In</span>
            </div>

            <!-- Banner -->
            <div id="banner" class="banner"></div>

            <!-- ═══ Login Form ═══ -->
            <form id="loginForm" novalidate autocomplete="off">
                <div class="field">
                    <label for="loginUser">Username</label>
                    <input type="text" id="loginUser" placeholder="Enter username" autocomplete="off">
                </div>
                <div class="field">
                    <label for="loginPass">Password</label>
                    <input type="password" id="loginPass" placeholder="Enter password" autocomplete="new-password">
                </div>
                <button type="submit" class="btn-primary" id="loginBtn">Sign In</button>
            </form>

            <!-- ═══ Register Form ═══ -->
            <form id="registerForm" class="hidden" novalidate autocomplete="off">
                <div class="field">
                    <label for="regUser">Username</label>
                    <input type="text" id="regUser" placeholder="Choose a username" autocomplete="off">
                </div>
                <div class="field">
                    <label for="regPass">Password</label>
                    <input type="password" id="regPass" placeholder="Create password" autocomplete="new-password">
                    <!-- Strength Indicator -->
                    <div class="strength-bar-container" id="strengthContainer">
                        <div class="strength-bar-track">
                            <div class="strength-bar-fill" id="strengthFill"></div>
                        </div>
                        <div class="strength-label" id="strengthLabel"></div>
                        <div class="strength-rules">
                            <span id="rule-len">✕ 8+ chars</span>
                            <span id="rule-upper">✕ Uppercase</span>
                            <span id="rule-digit">✕ Digit</span>
                            <span id="rule-special">✕ Special char</span>
                        </div>
                    </div>
                </div>
                <div class="field">
                    <label for="regConfirm">Confirm Password</label>
                    <input type="password" id="regConfirm" placeholder="Re-enter password" autocomplete="new-password">
                </div>
                <button type="submit" class="btn-primary" id="regBtn">Create Account</button>
            </form>

            <!-- Toggle -->
            <div class="toggle-text" id="toggleLogin">
                Don't have an account? <a id="toggleLink" onclick="toggleMode()">Register</a>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">Government of India · SAIL</div>
    </div>

    <script>
        // ── Redirect if already authenticated ──
        (function () {
            var token = localStorage.getItem('ferromind_token');
            if (token) {
                window.location.href = 'index.html';
            }
        })();

        // ── State ──
        var isLogin = true;
        var API_BASE = '/auth';

        // ── DOM refs ──
        var loginForm      = document.getElementById('loginForm');
        var registerForm   = document.getElementById('registerForm');
        var banner         = document.getElementById('banner');
        var cardTitleText  = document.getElementById('cardTitleText');
        var toggleLink     = document.getElementById('toggleLink');
        var strengthContainer = document.getElementById('strengthContainer');
        var strengthFill   = document.getElementById('strengthFill');
        var strengthLabel  = document.getElementById('strengthLabel');
        var ruleLen        = document.getElementById('rule-len');
        var ruleUpper      = document.getElementById('rule-upper');
        var ruleDigit      = document.getElementById('rule-digit');
        var ruleSpecial    = document.getElementById('rule-special');

        // ── Toggle Login / Register ──
        function toggleMode() {
            isLogin = !isLogin;
            hideBanner();
            if (isLogin) {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                cardTitleText.textContent = 'Sign In';
                toggleLink.textContent = 'Register';
                document.getElementById('toggleLogin').innerHTML =
                    'Don\'t have an account? <a onclick="toggleMode()">Register</a>';
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                cardTitleText.textContent = 'Create Account';
                toggleLink.textContent = 'Sign In';
                document.getElementById('toggleLogin').innerHTML =
                    'Already have an account? <a onclick="toggleMode()">Sign In</a>';
            }
        }

        // ── Banner helpers ──
        function showBanner(msg, type) {
            banner.textContent = msg;
            banner.className = 'banner ' + type;
        }

        function hideBanner() {
            banner.className = 'banner';
            banner.textContent = '';
        }

        // ── Password Strength ──
        var regPassInput = document.getElementById('regPass');
        regPassInput.addEventListener('input', function () {
            var val = this.value;
            if (val.length === 0) {
                strengthContainer.style.display = 'none';
                return;
            }
            strengthContainer.style.display = 'block';

            var hasLen     = val.length >= 8;
            var hasUpper   = /[A-Z]/.test(val);
            var hasDigit   = /\d/.test(val);
            var hasSpecial = /[^A-Za-z0-9]/.test(val);

            setRule(ruleLen,     hasLen,     '8+ chars');
            setRule(ruleUpper,   hasUpper,   'Uppercase');
            setRule(ruleDigit,   hasDigit,   'Digit');
            setRule(ruleSpecial, hasSpecial, 'Special char');

            var score = [hasLen, hasUpper, hasDigit, hasSpecial].filter(Boolean).length;
            var pct, color, label;
            switch (score) {
                case 0: pct = 5;   color = var_red();   label = 'Very Weak'; break;
                case 1: pct = 25;  color = var_red();   label = 'Weak';      break;
                case 2: pct = 50;  color = '#f59e0b';   label = 'Fair';      break;
                case 3: pct = 75;  color = var_accent(); label = 'Good';     break;
                case 4: pct = 100; color = var_green();  label = 'Strong';   break;
            }
            strengthFill.style.width = pct + '%';
            strengthFill.style.backgroundColor = color;
            strengthLabel.textContent = label;
            strengthLabel.style.color = color;
        });

        function setRule(el, pass, text) {
            el.textContent = (pass ? '✓' : '✕') + ' ' + text;
            el.className = pass ? 'pass' : '';
        }

        function var_red()    { return '#e5484d'; }
        function var_green()  { return '#27a644'; }
        function var_accent() { return '#5e6ad2'; }

        // ── Validate register password ──
        function validatePassword(pw) {
            if (pw.length < 8)           return 'Password must be at least 8 characters.';
            if (!/[A-Z]/.test(pw))       return 'Password must contain an uppercase letter.';
            if (!/\d/.test(pw))          return 'Password must contain a digit.';
            if (!/[^A-Za-z0-9]/.test(pw)) return 'Password must contain a special character.';
            return null;
        }

        // ── Login submit ──
        loginForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            hideBanner();

            var username = document.getElementById('loginUser').value.trim();
            var password = document.getElementById('loginPass').value;

            if (!username || !password) {
                showBanner('Please enter both username and password.', 'error');
                return;
            }

            var btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.textContent = 'Signing in…';

            try {
                var res = await fetch(API_BASE + '/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, password: password })
                });
                var data = await res.json();

                if (!res.ok || data.error) {
                    showBanner(data.error || 'Login failed. Please try again.', 'error');
                    document.getElementById('loginPass').value = '';
                } else {
                    localStorage.setItem('ferromind_token', data.token);
                    localStorage.setItem('ferromind_user', data.username || username);
                    localStorage.setItem('ferromind_role', data.role || 'operator');
                    if (data.logId) localStorage.setItem('ferromind_logId', data.logId);
                    window.location.href = 'index.html';
                }
            } catch (err) {
                showBanner('Unable to reach server. Please check your connection.', 'error');
                document.getElementById('loginPass').value = '';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        });

        // ── Register submit ──
        registerForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            hideBanner();

            var username = document.getElementById('regUser').value.trim();
            var password = document.getElementById('regPass').value;
            var confirm  = document.getElementById('regConfirm').value;

            if (!username || !password || !confirm) {
                showBanner('Please fill in all fields.', 'error');
                return;
            }

            var pwError = validatePassword(password);
            if (pwError) {
                showBanner(pwError, 'error');
                return;
            }

            if (password !== confirm) {
                showBanner('Passwords do not match.', 'error');
                document.getElementById('regConfirm').value = '';
                return;
            }

            var btn = document.getElementById('regBtn');
            btn.disabled = true;
            btn.textContent = 'Creating account…';

            try {
                var res = await fetch(API_BASE + '/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, password: password })
                });
                var data = await res.json();

                if (!res.ok || data.error) {
                    showBanner(data.error || 'Registration failed. Please try again.', 'error');
                    document.getElementById('regPass').value = '';
                    document.getElementById('regConfirm').value = '';
                } else {
                    showBanner(data.message || 'Account created successfully. Please sign in.', 'success');
                    // Clear register fields
                    document.getElementById('regUser').value = '';
                    document.getElementById('regPass').value = '';
                    document.getElementById('regConfirm').value = '';
                    strengthContainer.style.display = 'none';
                    // Switch to login after short delay
                    setTimeout(function () {
                        toggleMode();
                    }, 1500);
                }
            } catch (err) {
                showBanner('Unable to reach server. Please check your connection.', 'error');
                document.getElementById('regPass').value = '';
                document.getElementById('regConfirm').value = '';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Create Account';
            }
        });
    </script>
</body>
</html>
